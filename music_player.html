<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Music Player</title>
    <!--
    Installation / Usage Instructions:
    1. Save this file as 'music_player.html'.
    2. Open it in any modern web browser (Chrome, Firefox, Edge).
    3. Click 'Open Folder' to select your local music directory.
    4. Ensure you have an internet connection for the first load to fetch the metadata library (jsmediatags),
       or save the library locally for offline use.
    -->
    <style>
        :root {
            --bg-color: #121212;
            --sidebar-color: #1a1a1a;
            --accent-color: #16a085; /* Manjaro Green */
            --text-color: #e0e0e0;
            --text-dim: #a0a0a0;
            --border-color: #333;
            --hover-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        #folder-select {
            display: none;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .playlist {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .playlist-item {
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #222;
            gap: 15px;
        }

        .playlist-thumb {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
            background-color: #222;
        }

        .playlist-item:hover {
            background-color: var(--hover-color);
        }

        .playlist-item.active {
            background-color: var(--hover-color);
            border-left: 4px solid var(--accent-color);
        }

        .playlist-item-info {
            flex: 1;
            overflow: hidden;
        }

        .playlist-item-title {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-artist {
            font-size: 0.8rem;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        .album-art-container {
            width: 400px;
            height: 400px;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            background-color: #222;
            overflow: hidden;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #album-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-details {
            text-align: center;
        }

        #current-title {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        #current-artist {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        #current-album {
            font-size: 1rem;
            color: var(--text-dim);
        }

        /* Player Controls */
        .player-footer {
            height: 100px;
            background-color: var(--sidebar-color);
            border-top: 1px solid var(--border-color);
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .playback-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: var(--accent-color);
        }

        .play-pause {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: white;
        }

        .play-pause:hover {
            color: white;
            transform: scale(1.05);
        }

        .progress-container {
            flex: 1;
            margin: 0 40px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .progress-bar-wrapper {
            width: 100%;
            height: 5px;
            background-color: #333;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 5px;
            width: 0%;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .volume-container {
            width: 150px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #444;
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            margin-top: -4px;
        }

        /* Icons */
        svg {
            fill: currentColor;
            width: 24px;
            height: 24px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        /* Metadata Edit Modal (Mock) */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--sidebar-color);
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .form-group input {
            width: 100%;
            background-color: #222;
            border: 1px solid var(--border-color);
            padding: 8px;
            color: white;
            border-radius: 4px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>My Library</h2>
                <button class="btn-primary" onclick="document.getElementById('folder-select').click()">Open Folder</button>
                <input type="file" id="folder-select" webkitdirectory directory multiple>
            </div>
            <div class="playlist" id="playlist">
                <!-- Tracks will be added here -->
            </div>
        </aside>

        <main class="main-content">
            <div class="album-art-container">
                <img id="album-art" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM0NDQiIHN0cm9rZS13aWR0aD0iMSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOSAxOGgyYTIgMiAwIDAgMCAyLTJWNSIvPjxwYXRoIGQ9Ik05IDE4YTkgOSAwIDEgMSAxOCAwIDkgOSAwIDAgMS0xOCAwWiIvPjxjaXJjbGUgY3g9IjciIGN5PSIxOCIgcj0iMyIvPjwvc3ZnPg==" alt="Album Art">
            </div>
            <div class="song-details">
                <h1 id="current-title">No Song Selected</h1>
                <p id="current-artist">Select a folder to start</p>
                <p id="current-album"></p>
                <button class="btn-secondary" style="margin-top: 20px; font-size: 0.8rem;" onclick="openMetadataModal()">Edit Metadata</button>
            </div>
        </main>
    </div>

    <footer class="player-footer">
        <div class="playback-controls">
            <button class="control-btn" id="prev-btn">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="control-btn play-pause" id="play-btn">
                <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
                <svg viewBox="0 0 24 24" id="pause-icon" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="control-btn" id="next-btn">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>

        <div class="progress-container">
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div class="progress-bar-wrapper" id="progress-wrapper">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="volume-container">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>
    </footer>

    <!-- Metadata Modal -->
    <div class="modal" id="metadata-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Metadata</h3>
                <button class="control-btn" onclick="closeMetadataModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="edit-title">
            </div>
            <div class="form-group">
                <label>Artist</label>
                <input type="text" id="edit-artist">
            </div>
            <div class="form-group">
                <label>Album</label>
                <input type="text" id="edit-album">
            </div>
            <div class="form-group">
                <label>Genre</label>
                <input type="text" id="edit-genre">
            </div>
            <div class="form-group">
                <label>Year</label>
                <input type="text" id="edit-year">
            </div>
            <div class="form-group">
                <label>Custom Album Art</label>
                <input type="file" id="edit-cover" accept="image/*">
            </div>
            <p style="font-size: 0.7rem; color: #888; margin-top: 10px;">Note: Changes are session-only and not saved to disk.</p>
            <div class="btn-group">
                <button class="btn-secondary" onclick="closeMetadataModal()">Cancel</button>
                <button class="btn-primary" onclick="saveMetadata()">Apply Changes</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script>
        const audio = new Audio();
        let playlist = [];
        let currentIndex = -1;

        const folderSelect = document.getElementById('folder-select');
        const playlistContainer = document.getElementById('playlist');
        const albumArt = document.getElementById('album-art');
        const currentTitle = document.getElementById('current-title');
        const currentArtist = document.getElementById('current-artist');
        const currentAlbum = document.getElementById('current-album');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressWrapper = document.getElementById('progress-wrapper');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volume-slider');

        const metadataModal = document.getElementById('metadata-modal');
        const editTitle = document.getElementById('edit-title');
        const editArtist = document.getElementById('edit-artist');
        const editAlbum = document.getElementById('edit-album');
        const editGenre = document.getElementById('edit-genre');
        const editYear = document.getElementById('edit-year');

        // File Selection
        folderSelect.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files).filter(file =>
                file.type.startsWith('audio/') ||
                /\.(mp3|flac|ogg|wav)$/i.test(file.name)
            );

            if (files.length === 0) return;

            playlist = files.map((file, index) => ({
                file,
                index,
                title: file.name,
                artist: 'Unknown Artist',
                album: 'Unknown Album',
                genre: '',
                year: '',
                cover: null
            }));

            renderPlaylist();
            loadTrack(0);

            // Background metadata loading
            loadMetadataForPlaylist();
        });

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
                const thumbSrc = track.cover || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM0NDQiIHN0cm9rZS13aWR0aD0iMSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOSAxOGgyYTIgMiAwIDAgMCAyLTJWNSIvPjxwYXRoIGQ9Ik05IDE4YTkgOSAwIDEgMSAxOCAwIDkgOSAwIDAgMS0xOCAwWiIvPjxjaXJjbGUgY3g9IjciIGN5PSIxOCIgcj0iMyIvPjwvc3ZnPg==';
                item.innerHTML = `
                    <img src="${thumbSrc}" class="playlist-thumb">
                    <div class="playlist-item-info">
                        <div class="playlist-item-title">${track.title}</div>
                        <div class="playlist-item-artist">${track.artist}</div>
                    </div>
                `;
                item.onclick = () => loadTrack(index);
                playlistContainer.appendChild(item);
            });
        }

        async function loadMetadataForPlaylist() {
            for (let i = 0; i < playlist.length; i++) {
                try {
                    await new Promise((resolve, reject) => {
                        jsmediatags.read(playlist[i].file, {
                            onSuccess: (tag) => {
                                playlist[i].title = tag.tags.title || playlist[i].file.name;
                                playlist[i].artist = tag.tags.artist || 'Unknown Artist';
                                playlist[i].album = tag.tags.album || 'Unknown Album';
                                playlist[i].genre = tag.tags.genre || '';
                                playlist[i].year = tag.tags.year || '';

                                if (tag.tags.picture) {
                                    const { data, format } = tag.tags.picture;
                                    let base64String = "";
                                    for (let j = 0; j < data.length; j++) {
                                        base64String += String.fromCharCode(data[j]);
                                    }
                                    playlist[i].cover = `data:${format};base64,${window.btoa(base64String)}`;
                                }
                                resolve();
                            },
                            onError: (error) => {
                                console.warn('Could not read tags for', playlist[i].file.name, error);
                                resolve(); // Continue anyway
                            }
                        });
                    });

                    // Refresh UI if this is the currently playing track
                    if (i === currentIndex) {
                        updateDisplay(playlist[i]);
                    }
                    // Periodically update playlist UI
                    if (i % 5 === 0 || i === playlist.length - 1) {
                        renderPlaylist();
                    }
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function loadTrack(index) {
            if (index < 0 || index >= playlist.length) return;

            currentIndex = index;
            const track = playlist[index];

            if (audio.src) {
                URL.revokeObjectURL(audio.src);
            }

            audio.src = URL.createObjectURL(track.file);
            updateDisplay(track);
            renderPlaylist();
            playTrack();
        }

        function updateDisplay(track) {
            currentTitle.textContent = track.title;
            currentArtist.textContent = track.artist;
            currentAlbum.textContent = track.album || '';
            albumArt.src = track.cover || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM0NDQiIHN0cm9rZS13aWR0aD0iMSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOSAxOGgyYTIgMiAwIDAgMCAyLTJWNSIvPjxwYXRoIGQ9Ik05IDE4YTkgOSAwIDEgMSAxOCAwIDkgOSAwIDAgMS0xOCAwWiIvPjxjaXJjbGUgY3g9IjciIGN5PSIxOCIgcj0iMyIvPjwvc3ZnPg==';
        }

        function playTrack() {
            audio.play();
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
        }

        function pauseTrack() {
            audio.pause();
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        }

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                playTrack();
            } else {
                pauseTrack();
            }
        });

        prevBtn.addEventListener('click', () => {
            loadTrack(currentIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            loadTrack(currentIndex + 1);
        });

        audio.addEventListener('ended', () => {
            loadTrack(currentIndex + 1);
        });

        // Progress Bar
        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${percent}%`;
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        progressWrapper.addEventListener('click', (e) => {
            const width = progressWrapper.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        // Volume
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Metadata Modal
        window.openMetadataModal = () => {
            if (currentIndex === -1) return;
            const track = playlist[currentIndex];
            editTitle.value = track.title;
            editArtist.value = track.artist;
            editAlbum.value = track.album;
            editGenre.value = track.genre;
            editYear.value = track.year;
            metadataModal.style.display = 'flex';
        };

        window.closeMetadataModal = () => {
            metadataModal.style.display = 'none';
        };

        window.saveMetadata = async () => {
            const track = playlist[currentIndex];
            track.title = editTitle.value;
            track.artist = editArtist.value;
            track.album = editAlbum.value;
            track.genre = editGenre.value;
            track.year = editYear.value;

            const coverFile = document.getElementById('edit-cover').files[0];
            if (coverFile) {
                const reader = new FileReader();
                track.cover = await new Promise(resolve => {
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(coverFile);
                });
            }

            updateDisplay(track);
            renderPlaylist();
            closeMetadataModal();
            // Reset file input
            document.getElementById('edit-cover').value = '';
        };

        // Close modal when clicking outside
        window.onclick = (event) => {
            if (event.target == metadataModal) {
                closeMetadataModal();
            }
        };
    </script>
</body>
</html>
